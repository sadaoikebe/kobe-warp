# 運行情報フィード: JR西日本公式 → feed ブランチの status.json
# 置き場所: リポジトリの .github/workflows/feed.yml
name: feed
on:
  workflow_dispatch:
  schedule:
    # 平日 05:30〜11:55 JST を5分ごと（UTC: 日〜木 20:30-23:55 / 月〜金 00:00-02:55）
    - cron: '30-59/5 20 * * 0-4'
    - cron: '*/5 21-23 * * 0-4'
    - cron: '*/5 0-2 * * 1-5'
    # それ以外の時間帯は30分ごと（スケジュール停止の予防を兼ねる）
    - cron: '17,47 3-19 * * *'
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fetch
        run: |
          mkdir out
          node feed/fetch-status.js out/status.json
      - name: publish to feed branch
        run: |
          cd out
          git init -q -b feed
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add status.json
          git commit -qm "status $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
