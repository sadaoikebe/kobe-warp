# 運行情報フィード（移行前のつなぎ）: JR西日本公式 → feed ブランチの status.json
# 中継 Worker に切り替えると（enable-relay.sh）、このワークフローごと削除され、定期取得はゼロになる。
name: feed
on:
  workflow_dispatch:
  schedule:
    # 平日の通勤時間帯 06:30〜10:55 JST だけ、5分ごと（UTC: 日〜木 21:30-23:55 / 月〜金 00:00-01:55）
    # それ以外の時間帯・土日は取得しない。
    - cron: '30-59/5 21 * * 0-4'
    - cron: '*/5 22-23 * * 0-4'
    - cron: '*/5 0-1 * * 1-5'
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fetch
        run: |
          mkdir out
          node feed/fetch-status.js out/status.json
      - name: publish to feed branch
        run: |
          cd out
          git init -q -b feed
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add status.json
          git commit -qm "status $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
