<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WARP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>WARP</title>
<style>
html,body{margin:0;height:100%;background:#05010f;color:#eaf6ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden;overscroll-behavior-y:contain}
#warp{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#app,#gate{position:relative;z-index:2}
#gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
#gate[hidden]{display:none}
.g-logo{font-weight:900;font-style:italic;font-size:54px;letter-spacing:.04em;line-height:1;background:linear-gradient(100deg,#00f0ff,#b96bff 45%,#ff3df2 70%,#ffe14d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,240,255,.55));animation:gpulse 2.4s ease-in-out infinite}
@keyframes gpulse{50%{filter:drop-shadow(0 0 34px rgba(255,61,242,.8))}}
.g-sub{margin:10px 0 28px;font-size:13px;letter-spacing:.5em;color:#8fd8ff;opacity:.85}
#gate form{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
#gate input{font:inherit;font-size:20px;text-align:center;padding:14px;border-radius:14px;border:2px solid #00f0ff;background:rgba(5,1,15,.75);color:#fff;outline:none;box-shadow:0 0 22px rgba(0,240,255,.35),inset 0 0 12px rgba(0,240,255,.2)}
#gate button{font:inherit;font-weight:900;font-style:italic;font-size:22px;padding:14px;border:0;border-radius:14px;color:#05010f;background:linear-gradient(100deg,#00f0ff,#ff3df2);box-shadow:0 0 26px rgba(255,61,242,.6);cursor:pointer}
#gate .err{min-height:1.4em;color:#ff5470;font-weight:700}
#gate.shake form{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.g-logo,#gate.shake form,#flash.on{animation:none}}
</style>
</head>
<body>
<canvas id="warp" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="gate" hidden>
  <div class="g-logo">WARP GATE</div>
  <div class="g-sub">合言葉ヲ入力セヨ</div>
  <form id="gform" autocomplete="off">
    <input id="gpass" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉" aria-label="合言葉">
    <button type="submit">ENGAGE</button>
    <div class="err" id="gerr" role="alert"></div>
  </form>
</div>
<div id="app"></div>
<script>
/* ---------- ワープ背景エンジン（公開シェル側。中身のデータは含まない） ---------- */
(function () {
  var cv = document.getElementById('warp'), cx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, stars = [], parts = [], N = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = { speed: 0.22, target: 0.22, hueA: 185, hueB: 300, boostUntil: 0 };
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * DPR); H = cv.height = Math.floor(innerHeight * DPR);
    N = Math.min(260, Math.floor(innerWidth * innerHeight / 3200));
    while (stars.length < N) stars.push(mk(true));
    stars.length = N;
  }
  function mk(any) { return { x: (Math.random() * 2 - 1), y: (Math.random() * 2 - 1), z: any ? Math.random() * 0.95 + 0.05 : 1, h: Math.random() }; }
  var last = 0, running = true;
  function frame(t) {
    if (!running) return;
    var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    var boosting = t < S.boostUntil;
    var tgt = boosting ? 2.6 : S.target;
    if (reduce) tgt = Math.min(tgt, 0.06);
    S.speed += (tgt - S.speed) * Math.min(1, dt * (boosting ? 9 : 2.2));
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = 'rgba(5,1,15,' + (S.speed > 1 ? 0.22 : 0.42) + ')';
    cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    var ox = W / 2, oy = H * 0.42, f = Math.max(W, H) * 0.55;
    cx.lineCap = 'round';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], pz = s.z;
      s.z -= S.speed * dt * (0.55 + s.h * 0.9);
      if (s.z <= 0.02) { stars[i] = mk(false); continue; }
      var x1 = ox + s.x / pz * f, y1 = oy + s.y / pz * f, x2 = ox + s.x / s.z * f, y2 = oy + s.y / s.z * f;
      if (x2 < -50 || x2 > W + 50 || y2 < -50 || y2 > H + 50) { stars[i] = mk(false); continue; }
      var a = Math.min(1, (1 - s.z) * 1.4), hue = s.h < 0.6 ? S.hueA : S.hueB;
      cx.strokeStyle = 'hsla(' + hue + ',100%,' + (62 + s.h * 20) + '%,' + a + ')';
      cx.lineWidth = Math.max(1, (1 - s.z) * 2.6 * DPR);
      cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2 + (x2 - x1) * 0.01, y2 + (y2 - y1) * 0.01 + 0.5); cx.stroke();
    }
    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j]; p.l -= dt; if (p.l <= 0) { parts.splice(j, 1); continue; }
      p.vy += 900 * DPR * dt * p.g; p.x += p.vx * dt; p.y += p.vy * dt;
      cx.fillStyle = 'hsla(' + p.h + ',100%,65%,' + Math.min(1, p.l * 1.6) + ')';
      cx.beginPath(); cx.arc(p.x, p.y, p.r * DPR, 0, 6.283); cx.fill();
    }
    requestAnimationFrame(frame);
  }
  function burst(x, y, n, hues) {
    if (reduce) return;
    x = (x == null ? innerWidth / 2 : x) * DPR; y = (y == null ? innerHeight * 0.4 : y) * DPR;
    hues = hues || [185, 300, 50, 320];
    for (var i = 0; i < (n || 60); i++) {
      var a = Math.random() * 6.283, v = (160 + Math.random() * 620) * DPR;
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200 * DPR, l: 0.6 + Math.random() * 0.9, r: 1.5 + Math.random() * 3, h: hues[i % hues.length] + Math.random() * 20, g: 0.6 });
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);
  }
  function jump(ms) {
    S.boostUntil = performance.now() + (ms || 650);
    var fl = document.getElementById('flash');
    if (!reduce) { fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
  }
  function theme(name) {
    var T = { normal: [185, 300, 0.22], delay: [38, 8, 0.34], partial: [38, 355, 0.34], suspended: [0, 345, 0.5], notice: [200, 265, 0.22], unknown: [215, 255, 0.14], gold: [48, 30, 0.3] }[name] || [185, 300, 0.22];
    S.hueA = T[0]; S.hueB = T[1]; S.target = T[2];
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });
  resize(); requestAnimationFrame(frame);
  window.Warp = { burst: burst, jump: jump, theme: theme };
})();

/* ---------- 合言葉ゲート: app.bin (AES-GCM) を復号して起動 ---------- */
(function () {
  var SALT = 'c3HG7DMJopalXN3pjB1f+g==', ITER = 250000, BUILD = '07f2af8290';
  var gate = document.getElementById('gate'), form = document.getElementById('gform'), inp = document.getElementById('gpass'), err = document.getElementById('gerr');
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var blobP = fetch('app.bin?b=' + BUILD).then(function (r) { if (!r.ok) throw new Error('load'); return r.text(); }).then(b64d);
  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(SALT), iterations: ITER }, k, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function open(raw) {
    return blobP.then(function (blob) {
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12));
      });
    }).then(function (buf) {
      var p = JSON.parse(new TextDecoder().decode(buf));
      var st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st);
      gate.hidden = true;
      (0, eval)(p.js);
    });
  }
  function showGate(msg) { gate.hidden = false; err.textContent = msg || ''; setTimeout(function () { inp.focus(); }, 50); }
  function tryPass(pass, quiet) {
    return derive(pass).then(function (raw) {
      return open(raw).then(function () { LS.set('warp.key', SALT + ':' + b64e(raw)); if (!quiet) { Warp.jump(900); Warp.burst(null, null, 120); } });
    });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    tryPass(inp.value, false).catch(function () {
      gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
      err.textContent = 'ACCESS DENIED — 合言葉が違います'; inp.select();
    });
  });
  // #k=合言葉 で来たら保存してハッシュから消す
  var hk = /(?:^|[#&])k=([^&]+)/.exec(location.hash);
  if (hk) { history.replaceState(null, '', location.pathname + location.search + location.hash.replace(/(^#|&)k=[^&]+/, '$1').replace(/^#&?$/, '')); }
  var saved = (LS.get('warp.key') || '').split(':');
  var boot = hk ? tryPass(decodeURIComponent(hk[1]), true)
    : (saved[0] === SALT && saved[1]) ? open(b64d(saved[1])) : Promise.reject();
  boot.catch(function () { LS.del('warp.key'); showGate(hk ? 'ACCESS DENIED — 合言葉が違います' : ''); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
